plugins:
  - rubocop-rspec

AllCops:
  TargetRubyVersion: 4.0
  NewCops: enable
  SuggestExtensions: false

Layout/LineLength:
  Max: 120
Metrics/AbcSize:
  Max: 25
Metrics/BlockLength:
  Exclude:
    - 'spec/**/*'
Metrics/ClassLength:
  Max: 150
Metrics/CyclomaticComplexity:
  Max: 12
Metrics/MethodLength:
  Max: 25
Metrics/PerceivedComplexity:
  Max: 12

RSpec:
  Enabled: true

# Disable strict rule for multiple expectations in specs to reduce noise
RSpec/MultipleExpectations:
  Enabled: false

# Allow slightly longer examples in specs
RSpec/ExampleLength:
  Max: 15

# Allow deeper nesting for complex test scenarios (e.g., quantifiers)
RSpec/NestedGroups:
  Max: 4

# Disable documentation requirement for classes/modules (we prefer no noise comments)
Style/Documentation:
  Enabled: false
