plugins:
  - rubocop-rspec

AllCops:
  TargetRubyVersion: 3.4
  NewCops: enable
  SuggestExtensions: false

Layout/LineLength:
  Max: 120

Metrics/AbcSize:
  Max: 20
Metrics/BlockLength:
  Exclude:
    - 'spec/**/*'
Metrics/CyclomaticComplexity:
  Max: 10
Metrics/MethodLength:
  Max: 15
Metrics/PerceivedComplexity:
  Max: 10

RSpec:
  Enabled: true

# Disable strict rule for multiple expectations in specs to reduce noise
RSpec/MultipleExpectations:
  Enabled: false

# Allow slightly longer examples in specs
RSpec/ExampleLength:
  Max: 15

# Disable documentation requirement for classes/modules (we prefer no noise comments)
Style/Documentation:
  Enabled: false
